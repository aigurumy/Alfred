<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfred</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: transparent;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border-radius: 16px;
      box-sizing: border-box;
    }

    .container {
      background: rgba(20, 20, 25, 0.75);
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      border-radius: 16px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .header {
      text-align: left;
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      color: white;
      -webkit-app-region: drag;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-left {
      flex: 1;
      -webkit-app-region: drag;
    }

    .header-left h1 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
    }

    .header-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .header-controls {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
    }

    .control-btn.close:hover {
      background: rgba(239, 68, 68, 0.8);
      color: white;
    }

    h1 {
      color: white;
      margin-bottom: 2px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .word-status {
      margin-top: 6px;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      cursor: help;
      transition: all 0.2s;
    }

    .word-status:hover {
      transform: scale(1.05);
    }

    .word-status.ready {
      background: rgba(34, 197, 94, 0.2);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .word-status.not-ready {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .word-status.ready .status-indicator {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
      animation: pulse 2s infinite;
    }

    .word-status.not-ready .status-indicator {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-container.hidden {
      display: none;
    }

    .chat-container::-webkit-scrollbar {
      width: 6px;
    }

    .chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .chat-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: rgba(139, 92, 246, 0.3);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #a78bfa;
    }

    .message.ai .message-avatar {
      display: none; /* Hide bot avatar */
    }

    .message-content {
      max-width: 90%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 16px;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
      margin: 16px 0 8px 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .message-content h1 {
      font-size: 24px;
    }

    .message-content h2 {
      font-size: 22px;
    }

    .message-content h3 {
      font-size: 20px;
    }

    .message-content h4 {
      font-size: 18px;
    }

    .message-content h1:first-child,
    .message-content h2:first-child,
    .message-content h3:first-child,
    .message-content h4:first-child {
      margin-top: 0;
    }

    .message.user .message-content {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.25);
      color: #e9d5ff;
      border-bottom-right-radius: 4px;
    }

    .message.ai .message-content {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      color: rgba(255, 255, 255, 0.95);
      border: none;
      padding: 10px 0;
    }

    .message.system .message-content {
      background: rgba(34, 197, 94, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      font-size: 14px;
      max-width: 90%;
      text-align: center;
      margin: 0 auto;
    }

    .message.system {
      justify-content: center;
    }

    .message.system .message-avatar {
      display: none;
    }

    .message-actions {
      margin-top: 8px;
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-type-word {
      background: rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #c4b5fd;
    }

    .btn-type-word:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-type-word:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Clickable links inside chat messages */
    .chat-link {
      color: #93c5fd;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      word-break: break-all;
    }
    .chat-link:hover {
      color: #bfdbfe;
    }

    .btn-stop-typing {
      background: rgba(239, 68, 68, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .btn-stop-typing:hover {
      background: rgba(239, 68, 68, 0.4);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .btn-humanize {
      background: rgba(20, 184, 166, 0.25);
      border: 1px solid rgba(20, 184, 166, 0.45);
      color: #5eead4;
    }

    .btn-humanize:hover:not(:disabled) {
      background: rgba(20, 184, 166, 0.35);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
    }

    .btn-humanize:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-humanize-locked {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.35);
      cursor: default;
      opacity: 0.8;
    }
    .btn-humanize-locked:hover {
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.3);
      color: rgba(139, 92, 246, 0.7);
    }

    /* ── Humanize in-chat confirmation card ── */
    .message.system.humanize-confirm-card .message-content {
      background: rgba(20, 184, 166, 0.12);
      border-color: rgba(20, 184, 166, 0.35);
      color: #5eead4;
      text-align: left;
      padding: 12px 14px;
      max-width: 320px;
    }

    .humanize-confirm-text {
      margin-bottom: 10px;
      line-height: 1.55;
      font-size: 13px;
    }

    .humanize-confirm-text strong {
      color: #99f6e4;
    }

    .humanize-confirm-actions {
      display: flex;
      gap: 8px;
    }

    .btn-humanize-confirm {
      background: rgba(20, 184, 166, 0.28);
      border: 1px solid rgba(20, 184, 166, 0.5);
      color: #5eead4;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-humanize-confirm:hover {
      background: rgba(20, 184, 166, 0.42);
      transform: translateY(-1px);
    }

    .btn-humanize-cancel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.45);
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .btn-humanize-cancel:hover {
      background: rgba(255, 255, 255, 0.11);
      color: rgba(255, 255, 255, 0.7);
    }


    .input-area {
      padding: 16px;
      border-top: none;
      background: transparent;
      border-radius: 0 0 16px 16px;
    }

    .input-area.hidden {
      display: none;
    }

    /* File previews row above input */
    .file-previews {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .file-previews:empty {
      display: none;
    }

    .file-preview-card {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(55, 55, 70, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 5px 8px;
      max-width: 160px;
      position: relative;
    }

    .file-preview-card .file-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .file-preview-card .file-thumb {
      width: 28px;
      height: 28px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .file-preview-card .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-preview-card .file-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .file-preview-card .file-type-badge {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .file-preview-card .file-remove {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .file-preview-card .file-remove:hover {
      color: rgba(239, 68, 68, 0.9);
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    /* Inner field that wraps + button and textarea together */
    .input-field-inner {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px 0 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      background: rgba(55, 55, 65, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-field-inner:focus-within {
      border-color: rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    /* Upload button — now sits INSIDE the field */
    .upload-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 300;
      line-height: 1;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .upload-btn:hover {
      color: #c4b5fd;
      transform: scale(1.1);
    }

    .upload-btn.has-files {
      color: #c4b5fd;
    }

    /* Drag-over state */
    .input-area.drag-over {
      background: rgba(139, 92, 246, 0.08);
      border-radius: 0 0 16px 16px;
      outline: 1px dashed rgba(139, 92, 246, 0.5);
    }

    /* File attachment shown in user message bubble */
    .message-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
      justify-content: flex-end;
    }

    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      color: #c4b5fd;
    }

    .attachment-chip .chip-thumb {
      width: 20px;
      height: 20px;
      object-fit: cover;
      border-radius: 3px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 0;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      max-height: 100px;
      transition: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.5;
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .chat-input:focus {
      outline: none;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #c4b5fd;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
      background: rgba(139, 92, 246, 0.4);
      border-color: rgba(139, 92, 246, 0.7);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .option-btn {
      padding: 6px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      background: white;
      color: #666;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #f5f5f5;
      border-color: #667eea;
    }

    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      animation: bounce 1.4s infinite ease-in-out;
    }

    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .typing-indicator {
      padding: 12px 16px;
      background: rgba(55, 55, 65, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
    }

    /* Welcome Screen */
    .welcome-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      animation: fadeIn 0.3s ease-in;
      background: rgba(20, 20, 25, 1); /* Fully opaque */
    }

    .welcome-screen.hidden {
      display: none;
    }

    .welcome-content {
      background: rgba(30, 30, 40, 1); /* Fully opaque, no blur */
      border-radius: 16px;
      padding: 28px 32px;
      max-width: 480px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      position: relative;
    }

    .welcome-content::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(145deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .welcome-icon {
      width: 160px;
      height: 160px;
      margin: 0 auto 24px;
      animation: float 3s ease-in-out infinite;
      display: block;
    }

    .welcome-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      display: block;
      width: 100%;
    }

    .welcome-description {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .welcome-steps {
      text-align: left;
      margin-bottom: 20px;
      background: rgba(55, 55, 70, 0.5);
      border-radius: 12px;
      padding: 18px;
    }

    .welcome-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
      color: rgba(255, 255, 255, 0.9);
    }

    .welcome-step:last-child {
      margin-bottom: 0;
    }

    .step-number {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.5);
      flex-shrink: 0;
    }

    .step-content {
      flex: 1;
      padding-top: 4px;
    }

    .step-title {
      font-weight: 600;
      font-size: 16px;
      color: white;
      margin-bottom: 4px;
    }

    .step-description {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
    }

    .welcome-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px 0 rgba(102, 126, 234, 0.4);
    }

    .welcome-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(102, 126, 234, 0.6);
    }

    .welcome-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1><img src="Alfred Official Logo.png" alt="Alfred" class="header-logo" onerror="this.outerHTML='🎩';">Alfred</h1>
        <div id="wordStatus" class="word-status not-ready">Checking Word...</div>
      </div>
      <div class="header-controls">
        <button class="control-btn minimize" onclick="window.electronAPI?.minimize?.()" title="Minimize">−</button>
        <button class="control-btn maximize" onclick="window.electronAPI?.toggleMaximize?.()" title="Maximize">□</button>
        <button class="control-btn close" onclick="window.close()" title="Close">✕</button>
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="message ai">
        <div class="message-content">
          What would you like help writing today?
        </div>
      </div>
    </div>

    <div class="input-area" id="inputArea">
      <!-- Hidden file input (triggered by upload button) -->
      <input 
        type="file" 
        id="fileInput" 
        multiple 
        accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.docx,.doc,.txt,.md,.rtf"
        style="display:none;"
      />
      <!-- File preview cards -->
      <div class="file-previews" id="filePreviews"></div>
      <div class="input-wrapper">
        <!-- Unified input field with + button inside -->
        <div class="input-field-inner">
          <button class="upload-btn" id="uploadBtn" title="Attach files (images, PDFs, Word docs, text files)" onclick="triggerFileUpload()">+</button>
        <textarea 
          id="chatInput" 
          class="chat-input" 
          placeholder="Type your message..."
          rows="1"
        ></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
